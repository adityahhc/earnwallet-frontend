<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#000;
      color:gold;
      font-family:Arial;
      padding:20px;
    }
    .box {
      max-width:400px;
      margin:auto;
      border:1px solid gold;
      padding:20px;
      border-radius:10px;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:5px;
      border:none;
    }
    button {
      background:gold;
      font-weight:bold;
    }
    .order {
      border:1px solid gold;
      padding:10px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>Admin Login</h2>
  <input type="password" id="password" placeholder="Enter Password">
  <button onclick="login()">Login</button>
</div>

<div class="box" id="adminBox" style="display:none">
  <h2>Admin Panel</h2>
  <div id="orders"></div>
</div>

<script>
  const ADMIN_PASSWORD = "earnwallet123";

  function login() {
    const pass = document.getElementById("password").value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminBox").style.display = "block";
      loadOrders();
    } else {
      alert("Wrong password");
    }
  }

  function loadOrders() {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const container = document.getElementById("orders");

    if (orders.length === 0) {
      container.innerHTML = "No orders yet";
      return;
    }

    orders.forEach(o => {
      container.innerHTML += `
        <div class="order">
          Name: ${o.name}<br>
          Bank: ${o.bank}<br>
          IFSC: ${o.ifsc}
        </div>
      `;
    });
  }
</script>

</body>
</html>
