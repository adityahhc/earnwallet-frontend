<script>
  // default password (first time)
  if (!localStorage.getItem("adminPassword")) {
    localStorage.setItem("adminPassword", "earnwallet123");
  }

  function login() {
    const pass = document.getElementById("password").value;
    const savedPass = localStorage.getItem("adminPassword");

    if (pass === savedPass) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminBox").style.display = "block";
      loadOrders();
    } else {
      alert("Wrong password");
    }
  }

  function loadOrders() {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if (orders.length === 0) {
      container.innerHTML = "No orders yet";
      return;
    }

    orders.forEach(o => {
      container.innerHTML += `
        <div class="order">
          Name: ${o.name}<br>
          Bank: ${o.bank}<br>
          IFSC: ${o.ifsc}
        </div>
      `;
    });
  }

  // CHANGE PASSWORD FUNCTION
  function changePassword() {
    const oldPass = document.getElementById("oldPass").value;
    const newPass = document.getElementById("newPass").value;
    const savedPass = localStorage.getItem("adminPassword");

    if (oldPass !== savedPass) {
      alert("Old password incorrect");
      return;
    }

    if (newPass.length < 4) {
      alert("Password too short");
      return;
    }

    localStorage.setItem("adminPassword", newPass);
    alert("Password changed successfully");
    document.getElementById("oldPass").value = "";
    document.getElementById("newPass").value = "";
  }
</script><hr style="border-color:gold">

<h3>Change Password</h3>
<input type="password" id="oldPass" placeholder="Old Password">
<input type="password" id="newPass" placeholder="New Password">
<button onclick="changePassword()">Change Password</button>
